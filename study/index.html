<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HSK 1 단어 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3948913814367331" crossorigin="anonymous"></script>
<style>
  .study-page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0;
  }
  #progress {
    font-size: 0.95rem;
  }
  #message {
    padding: 2rem 1rem;
    text-align: center;
  }
  #message.err { color: var(--text-error); }

  .scene {
    width: 100%;
    min-height: 320px;
  }
  .flashcard {
    width: 100%;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    gap: 1.25rem;
  }
  .hanzi {
    font-size: clamp(3rem, 16vw, 4.25rem);
    line-height: 1;
  }

  .speak-btn {
    width: 3rem;
    height: 3rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--border-card);
    border-radius: 50%;
    background: var(--bg-card);
    color: var(--text-hanzi);
    cursor: pointer;
  }
  .speak-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .speak-btn:not(:disabled):active {
    background: var(--border-card);
  }
  .speak-btn .wave {
    opacity: 0.9;
  }
  .speak-btn.playing .wave {
    animation: speak-wave 0.9s ease-in-out infinite;
  }
  .speak-btn.playing .wave2 {
    animation-delay: 0.15s;
  }
  @keyframes speak-wave {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  .speak-hint {
    font-size: 0.8rem;
    text-align: center;
  }

  .pinyin {
    font-size: clamp(1.1rem, 5vw, 1.4rem);
  }
  .meaning {
    font-size: clamp(1.1rem, 5vw, 1.4rem);
  }

  .maskable {
    position: relative;
    display: inline-block;
    max-width: 100%;
    min-width: 6.5rem;
    min-height: 2.2rem;
  }
  .mask {
    display: none;
    position: absolute;
    inset: -0.2em -0.6em;
    align-items: center;
    justify-content: center;
    background: var(--border-card);
    border-radius: 8px;
    color: var(--text-hanzi);
    font-family: var(--font-ui);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0;
    font-style: normal;
    cursor: pointer;
    white-space: nowrap;
  }
  .maskable.masked .mask {
    display: flex;
  }
  .maskable.masked #pinyin,
  .maskable.masked #meaning {
    visibility: hidden;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    width: 100%;
  }
  button.nav-btn {
    flex: 1;
    max-width: 140px;
    padding: 0.85rem 1rem;
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    border: 2px solid var(--border-card);
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text-hanzi);
    cursor: pointer;
  }
  button.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.nav-btn:not(:disabled):active {
    background: var(--border-card);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <main class="page-main">
  <div class="study-page">
    <h1 id="pageTitle" class="text-label">HSK 단어</h1>
    <div id="progress" class="text-label hidden"></div>

    <div id="message" class="text-label">불러오는 중...</div>

    <div id="scene" class="scene hidden">
      <div id="flashcard" class="card flashcard">
        <div id="hanzi" class="text-hanzi hanzi"></div>

        <button id="speakBtn" type="button" class="speak-btn" aria-label="발음 듣기" disabled>
          <svg class="wave-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor" />
            <path class="wave wave1" d="M16.2 8.8a5 5 0 0 1 0 6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path class="wave wave2" d="M18.8 6.2a9 9 0 0 1 0 11.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div id="speakHint" class="text-label speak-hint hidden">이 기기에서는 발음 재생을 지원하지 않아요</div>

        <div class="maskable" data-field="pinyin">
          <div id="pinyin" class="text-pinyin pinyin"></div>
          <div class="mask">탭하여 보기</div>
        </div>
        <div class="maskable" data-field="meaning">
          <div id="meaning" class="text-meaning meaning"></div>
          <div class="mask">탭하여 보기</div>
        </div>
      </div>
    </div>

    <div id="controls" class="controls hidden">
      <button id="prevBtn" class="nav-btn">이전</button>
      <button id="nextBtn" class="nav-btn">다음</button>
    </div>

    <ins class="adsbygoogle ad-slot"
         style="display:block"
         data-ad-client="ca-pub-3948913814367331"
         data-ad-slot="2736729534"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
  </main>

  <nav class="site-nav">
    <a href="/">홈</a>
    <a href="/about/">소개</a>
    <a href="/hsk1-guide/">HSK 1급 가이드</a>
    <a href="/contact/">문의</a>
    <a href="/privacy/">개인정보처리방침</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>
  <script src="../speech.js"></script>
  <script src="study.js"></script>
</body>
</html>
