<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HSK 1 단어 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .study-page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0;
  }
  #progress {
    font-size: 0.95rem;
  }
  #message {
    padding: 2rem 1rem;
    text-align: center;
  }
  #message.err { color: var(--text-error); }

  .scene {
    width: 100%;
    min-height: 320px;
  }
  .flashcard {
    width: 100%;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    gap: 1.25rem;
  }
  .hanzi {
    font-size: clamp(3rem, 16vw, 4.25rem);
    line-height: 1;
  }
  .pinyin {
    font-size: clamp(1.1rem, 5vw, 1.4rem);
  }
  .meaning {
    font-size: clamp(1.1rem, 5vw, 1.4rem);
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    width: 100%;
  }
  button.nav-btn {
    flex: 1;
    max-width: 140px;
    padding: 0.85rem 1rem;
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    border: 2px solid var(--border-card);
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text-hanzi);
    cursor: pointer;
  }
  button.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.nav-btn:not(:disabled):active {
    background: var(--border-card);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="study-page">
    <h1 class="text-label">HSK 1급 단어</h1>
    <div id="progress" class="text-label hidden"></div>

    <div id="message" class="text-label">불러오는 중...</div>

    <div id="scene" class="scene hidden">
      <div id="flashcard" class="card flashcard">
        <div id="hanzi" class="text-hanzi hanzi"></div>
        <div id="pinyin" class="text-pinyin pinyin"></div>
        <div id="meaning" class="text-meaning meaning"></div>
      </div>
    </div>

    <div id="controls" class="controls hidden">
      <button id="prevBtn" class="nav-btn">이전</button>
      <button id="nextBtn" class="nav-btn">다음</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>
  <script src="study.js"></script>
</body>
</html>
