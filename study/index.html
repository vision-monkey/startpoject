<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HSK 1 단어 학습</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 1.5rem;
  }
  .study-page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #94a3b8;
    margin: 0;
  }
  #progress {
    font-size: 0.95rem;
    color: #94a3b8;
  }
  #message {
    padding: 2rem 1rem;
    text-align: center;
    color: #94a3b8;
  }
  #message.err { color: #fca5a5; }

  .scene {
    width: 100%;
    height: 320px;
    perspective: 1200px;
  }
  .flashcard {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s;
  }
  .flashcard.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    background: #1e293b;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    gap: 0.75rem;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .hanzi {
    font-size: clamp(3rem, 18vw, 5.5rem);
    line-height: 1;
    font-weight: 600;
  }
  .pinyin {
    font-size: clamp(1.25rem, 6vw, 1.75rem);
    color: #7dd3fc;
  }
  .meaning {
    font-size: clamp(1.1rem, 5vw, 1.4rem);
    color: #e2e8f0;
  }
  .hint {
    position: absolute;
    bottom: 0.75rem;
    font-size: 0.75rem;
    color: #64748b;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    width: 100%;
  }
  button.nav-btn {
    flex: 1;
    max-width: 140px;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: #e2e8f0;
    cursor: pointer;
  }
  button.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.nav-btn:not(:disabled):active {
    background: #475569;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="study-page">
    <h1>HSK 1급 단어</h1>
    <div id="progress" class="hidden"></div>

    <div id="message">불러오는 중...</div>

    <div id="scene" class="scene hidden">
      <div id="flashcard" class="flashcard">
        <div class="face front">
          <div id="hanzi" class="hanzi"></div>
          <div class="hint">탭하면 뒤집혀요</div>
        </div>
        <div class="face back">
          <div id="pinyin" class="pinyin"></div>
          <div id="meaning" class="meaning"></div>
        </div>
      </div>
    </div>

    <div id="controls" class="controls hidden">
      <button id="prevBtn" class="nav-btn">이전</button>
      <button id="nextBtn" class="nav-btn">다음</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>
  <script src="study.js"></script>
</body>
</html>
