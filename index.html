<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HSK 단어 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3948913814367331" crossorigin="anonymous"></script>
<style>
  .ad-wrap {
    width: 100%;
    max-width: 420px;
  }
  .level-heading {
    margin: 0;
    text-align: center;
  }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    width: 100%;
    max-width: 420px;
  }
  .level-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
    font-size: clamp(1.1rem, 5vw, 1.4rem);
    font-weight: 600;
    cursor: pointer;
  }
  .level-btn:active {
    background: var(--border-card);
  }

  dialog#settingsModal {
    width: min(380px, calc(100vw - 2.5rem));
    padding: 1.75rem 1.5rem 1.5rem;
    font-family: var(--font-ui);
  }
  dialog#settingsModal[open] {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  dialog#settingsModal::backdrop {
    background: rgba(40, 26, 10, 0.4);
  }
  .modal-title {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .setting-title {
    font-weight: 500;
    font-size: 0.95rem;
  }
  .option-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .option-btn {
    display: inline-flex;
    align-items: center;
    padding: 0.55rem 1rem;
    border: 2px solid var(--border-card);
    border-radius: 999px;
    background: var(--bg-card);
    color: var(--text-meaning);
    font-size: 0.9rem;
    font-family: var(--font-ui);
    cursor: pointer;
    user-select: none;
  }
  .option-btn input {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    pointer-events: none;
  }
  .option-btn:has(input:checked) {
    background: var(--text-hanzi);
    border-color: var(--text-hanzi);
    color: var(--bg-card);
    font-weight: 600;
  }
  .option-btn:has(input:focus-visible) {
    outline: 2px solid var(--text-hanzi);
    outline-offset: 2px;
  }
  .option-divider {
    align-self: center;
    color: var(--border-card);
    font-size: 1.1rem;
  }
  .option-btn[hidden],
  .option-divider[hidden] {
    display: none !important;
  }
  #startBtn {
    margin-top: 0.25rem;
    padding: 0.9rem 1rem;
    border: none;
    border-radius: 12px;
    background: var(--text-hanzi);
    color: var(--bg-card);
    font-family: var(--font-ui);
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <main class="page-main">
    <h1 class="level-heading text-label">중국어 쎼쎼</h1>
    <div class="level-grid">
      <button type="button" class="card level-btn text-hanzi" data-level="1">HSK 1급</button>
      <button type="button" class="card level-btn text-hanzi" data-level="2">HSK 2급</button>
      <button type="button" class="card level-btn text-hanzi" data-level="3">HSK 3급</button>
      <button type="button" class="card level-btn text-hanzi" data-level="4">HSK 4급</button>
      <button type="button" class="card level-btn text-hanzi" data-level="5">HSK 5급</button>
      <button type="button" class="card level-btn text-hanzi" data-level="6">HSK 6급</button>
    </div>

    <div class="ad-wrap">
      <ins class="adsbygoogle ad-slot"
           style="display:block"
           data-ad-client="ca-pub-3948913814367331"
           data-ad-slot="2736729534"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </main>

  <nav class="mode-nav">
    <a href="/" aria-current="page">HSK</a>
    <a href="/sentences/">일상 표현</a>
  </nav>
  <nav class="site-nav">
    <a href="/" aria-current="page">홈</a>
    <a href="/about/">소개</a>
    <a href="/hsk1-guide/">HSK 1급 가이드</a>
    <a href="/contact/">문의</a>
    <a href="/privacy/">개인정보처리방침</a>
  </nav>

  <dialog id="settingsModal" class="card">
    <h2 class="modal-title text-label" id="modalTitle">학습 설정</h2>

    <div class="setting-group">
      <div class="setting-title text-label">모드</div>
      <div class="option-row">
        <label class="option-btn"><input type="radio" name="mode" value="manual"> 수동</label>
        <label class="option-btn"><input type="radio" name="mode" value="auto" checked> 자동</label>
        <span class="option-divider auto-only">|</span>
        <label class="option-btn auto-only"><input type="checkbox" id="autoSpeakCheckbox" checked> 발음 읽어주기</label>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-title text-label">가릴 항목</div>
      <div class="option-row">
        <label class="option-btn"><input type="checkbox" name="hide" value="pinyin"> 병음</label>
        <label class="option-btn"><input type="checkbox" name="hide" value="meaning" checked> 뜻 (한글)</label>
      </div>
    </div>

    <div class="setting-group" id="intervalGroup">
      <div class="setting-title text-label">카드 전환 간격</div>
      <div class="option-row">
        <label class="option-btn"><input type="radio" name="interval" value="2" checked> 2초</label>
        <label class="option-btn"><input type="radio" name="interval" value="4"> 4초</label>
        <label class="option-btn"><input type="radio" name="interval" value="8"> 8초</label>
      </div>
    </div>

    <button id="startBtn" type="button">시작하기</button>
  </dialog>

  <script src="home.js"></script>
</body>
</html>
