<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Supabase Site</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    background: #1e293b;
    padding: 2.5rem 3rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
    max-width: 420px;
  }
  h1 {
    margin-top: 0;
    font-size: 1.5rem;
  }
  #status {
    margin-top: 1.5rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-weight: 600;
  }
  .ok { background: #14532d; color: #bbf7d0; }
  .err { background: #7f1d1d; color: #fecaca; }
  .pending { background: #334155; color: #cbd5e1; }
</style>
</head>
<body>
  <div class="card">
    <h1>빈 웹사이트</h1>
    <p>Supabase와 연결된 시작 페이지입니다.</p>
    <div id="status" class="pending">연결 확인 중...</div>
    <p style="margin-top: 1.5rem;"><a href="study/" style="color: #7dd3fc;">HSK 1급 단어 학습하기 →</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
